<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Read</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/counterapi/dist/counter.browser.min.js"></script>

<style>
body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#020617,#000);
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.card{
    width:90%;
    max-width:520px;
    padding:45px;
    border-radius:30px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(0,255,255,0.3);
    box-shadow:0 0 40px rgba(0,255,255,0.25);
}

h1{
    font-size:3rem;
    color:#00ffff;
}

p{
    color:#cbd5e1;
    font-size:1.2rem;
}

.label{
    margin-top:30px;
    color:#94a3b8;
    letter-spacing:2px;
}

#counter{
    font-size:5rem;
    font-weight:900;
    color:#00ffff;
    text-shadow:0 0 25px #00ffff;
}

.btn{
    margin-top:30px;
    display:inline-block;
    padding:18px 28px;
    border-radius:18px;
    background:linear-gradient(135deg,#2563eb,#00ffff);
    color:white;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
    <h1>QR READ</h1>

    <p>
        Thanks for scanning the QR code.<br>
        Your visit has been counted.
    </p>

    <div class="label">TOTAL QR READS</div>

    <div id="counter">...</div>

    <a class="btn" href="https://aabproducoes.github.io/Links/">
        OPEN AAB PRODUÇÕES
    </a>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

    const counter = new Counter({
        workspace: "aabproducoes"
    });

    counter.up("qrread")
        .then(result => {
            document.getElementById("counter").textContent = result.value;
        })
        .catch(error => {
            console.error(error);
            document.getElementById("counter").textContent = "ERROR";
        });

});
</script>

</body>
</html>
