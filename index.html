<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAB Links - Living 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #00c8ff;
            --color-secondary: #ffd166;
            --color-accent: #9d4edd;
            --color-pink: #ff4fd8;
            --color-background: #030814;
            --color-text: #f1fbff;
            --color-muted: #a9bdd2;
            --color-card-bg: rgba(10, 23, 45, 0.62);
            --color-link-bg: rgba(0, 200, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.16);
            --shadow-light: 0 24px 70px rgba(0, 0, 0, 0.45);
            --clock-height: 58px;
            --clock-dot-color: #ffd166;
            --clock-dot-inactive: rgba(255, 255, 255, 0.16);
            --mx: 0px;
            --my: 0px;
            --rx: 0deg;
            --ry: 0deg;
        }

        .light-mode {
            --color-primary: #006dff;
            --color-secondary: #ffb703;
            --color-accent: #6c3cff;
            --color-pink: #e94cff;
            --color-background: #eef6ff;
            --color-text: #08172a;
            --color-muted: #4f6078;
            --color-card-bg: rgba(255, 255, 255, 0.68);
            --color-link-bg: rgba(0, 109, 255, 0.08);
            --glass-border: rgba(0, 35, 80, 0.13);
            --shadow-light: 0 20px 55px rgba(0, 80, 180, 0.18);
            --clock-dot-inactive: rgba(0, 109, 255, 0.22);
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 0 0 var(--clock-height) 0;
            font-family: 'Poppins', Arial, sans-serif;
            color: var(--color-text);
            line-height: 1.6;
            overflow-x: hidden;
            background:
                radial-gradient(circle at calc(20% + var(--mx) * 0.015) calc(12% + var(--my) * 0.015), rgba(0, 200, 255, 0.34), transparent 30%),
                radial-gradient(circle at calc(82% - var(--mx) * 0.012) calc(22% - var(--my) * 0.012), rgba(157, 78, 221, 0.34), transparent 31%),
                radial-gradient(circle at calc(50% + var(--mx) * 0.008) calc(95% + var(--my) * 0.008), rgba(255, 209, 102, 0.12), transparent 35%),
                var(--color-background);
            transition: background-color 0.35s, color 0.35s;
            perspective: 1100px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -5;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
            background-size: 44px 44px;
            transform: translate3d(calc(var(--mx) * -0.015), calc(var(--my) * -0.015), 0);
            mask-image: linear-gradient(to bottom, black, transparent 88%);
        }

        .scene {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -4;
            perspective: 900px;
        }

        .depth-layer {
            position: absolute;
            inset: -12%;
            transform-style: preserve-3d;
            transition: transform 0.18s ease-out;
        }

        .layer-back {
            filter: blur(2.5px);
            opacity: 0.5;
            transform: translate3d(calc(var(--mx) * -0.018), calc(var(--my) * -0.018), -160px) rotateX(calc(var(--rx) * 0.3)) rotateY(calc(var(--ry) * 0.3));
        }

        .layer-mid {
            opacity: 0.72;
            transform: translate3d(calc(var(--mx) * -0.035), calc(var(--my) * -0.035), -70px) rotateX(calc(var(--rx) * 0.55)) rotateY(calc(var(--ry) * 0.55));
        }

        .layer-front {
            filter: blur(0.4px);
            opacity: 0.9;
            transform: translate3d(calc(var(--mx) * -0.06), calc(var(--my) * -0.06), 20px) rotateX(calc(var(--rx) * 0.8)) rotateY(calc(var(--ry) * 0.8));
        }

        .shape {
            position: absolute;
            width: var(--size);
            height: var(--size);
            left: var(--x);
            top: var(--y);
            border: 1px solid rgba(255,255,255,0.22);
            background: linear-gradient(135deg, rgba(0,200,255,0.18), rgba(157,78,221,0.12));
            box-shadow:
                0 0 28px rgba(0, 200, 255, 0.16),
                inset 0 0 24px rgba(255,255,255,0.06);
            transform: rotate(var(--rot));
            animation: float3d var(--speed) ease-in-out infinite alternate;
        }

        .shape.circle { border-radius: 999px; }
        .shape.diamond { border-radius: 16px; transform: rotate(45deg); }
        .shape.triangle {
            width: 0;
            height: 0;
            background: transparent;
            border-left: calc(var(--size) / 2) solid transparent;
            border-right: calc(var(--size) / 2) solid transparent;
            border-bottom: var(--size) solid rgba(0, 200, 255, 0.14);
            box-shadow: none;
        }

        @keyframes float3d {
            from { translate: 0 0; rotate: 0deg; }
            to { translate: var(--dx) var(--dy); rotate: 18deg; }
        }

        .orb {
            position: fixed;
            width: 34vmax;
            height: 34vmax;
            left: 50%;
            top: 50%;
            translate: -50% -50%;
            border-radius: 50%;
            pointer-events: none;
            z-index: -6;
            background: conic-gradient(from 0deg, transparent, rgba(0,200,255,0.13), transparent, rgba(255,79,216,0.13), transparent, rgba(255,209,102,0.08), transparent);
            filter: blur(22px);
            animation: spinOrb 26s linear infinite;
            transform: translate3d(calc(var(--mx) * 0.02), calc(var(--my) * 0.02), 0);
        }

        @keyframes spinOrb {
            to { rotate: 360deg; }
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 22px;
            background: rgba(4, 12, 28, 0.68);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
            transform: translateZ(80px);
        }

        .light-mode header { background: rgba(255, 255, 255, 0.7); }

        .logo {
            flex: 1;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.25rem, 4vw, 1.85rem);
            font-weight: 800;
            letter-spacing: 0.1em;
            color: var(--color-secondary);
            text-shadow: 0 0 18px rgba(255, 209, 102, 0.58);
        }

        .logo::after {
            content: "LIVING 3D PORTAL";
            display: block;
            margin-top: -2px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.39em;
            letter-spacing: 0.35em;
            color: var(--color-muted);
        }

        .header-controls {
            display: flex;
            gap: 10px;
            order: 3;
        }

        .control-button {
            width: 43px;
            height: 43px;
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            color: var(--color-text);
            background: rgba(255, 255, 255, 0.08);
            cursor: pointer;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
        }

        .control-button:hover {
            transform: translateY(-3px) translateZ(20px) scale(1.05);
            background: rgba(0, 200, 255, 0.18);
