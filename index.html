<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAB Links - Living 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00c8ff;
            --secondary: #ffd166;
            --purple: #8a5cff;
            --pink: #ff4fd8;
            --bg: #050912;
            --text: #f1fbff;
            --muted: #9fb6c9;
            --glass: rgba(10, 22, 42, 0.62);
            --glass-strong: rgba(8, 18, 34, 0.82);
            --border: rgba(255, 255, 255, 0.16);
            --shadow: 0 28px 80px rgba(0, 0, 0, 0.45);
            --clock-height: 58px;
            --mx: 0;
            --my: 0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: var(--clock-height);
            font-family: 'Poppins', sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at calc(50% + var(--mx) * 14px) calc(20% + var(--my) * 10px), rgba(0, 200, 255, 0.36), transparent 28%),
                radial-gradient(circle at calc(82% - var(--mx) * 18px) calc(32% - var(--my) * 12px), rgba(138, 92, 255, 0.3), transparent 32%),
                radial-gradient(circle at calc(25% + var(--mx) * 22px) calc(82% - var(--my) * 12px), rgba(255, 79, 216, 0.18), transparent 28%),
                var(--bg);
            perspective: 1200px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -5;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,0.038) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.038) 1px, transparent 1px);
            background-size: 52px 52px;
            transform: translate3d(calc(var(--mx) * -14px), calc(var(--my) * -14px), 0) scale(1.08);
            mask-image: linear-gradient(to bottom, black, transparent 82%);
        }

        .scene {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            overflow: hidden;
            perspective: 1000px;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(0,200,255,0.5), transparent 68%);
            box-shadow: 0 0 60px rgba(0,200,255,0.5);
            animation: floatOrb 10s ease-in-out infinite alternate;
        }

        .orb.one {
            width: 190px;
            height: 190px;
            left: 5%;
            top: 16%;
        }

        .orb.two {
            width: 120px;
            height: 120px;
            right: 9%;
            top: 18%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,209,102,0.5), transparent 68%);
        }

        .orb.three {
            width: 260px;
            height: 260px;
            left: 68%;
            top: 68%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(138,92,255,0.45), transparent 68%);
        }

        @keyframes floatOrb {
            from {
                transform: translate3d(calc(var(--mx) * 20px), calc(var(--my) * 18px), -80px);
            }
            to {
                transform: translate3d(calc(var(--mx) * -30px), calc(var(--my) * -24px - 28px), 80px);
            }
        }

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 28px;
            background: var(--glass-strong);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--secondary);
            text-shadow: 0 0 18px rgba(255,209,102,0.5);
        }

        main {
            width: min(1120px, calc(100% - 32px));
            margin: auto;
            padding: 50px 0;
            display: grid;
            gap: 28px;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            transform-style: preserve-3d;
            transform: rotateX(calc(var(--my) * -1.2deg)) rotateY(calc(var(--mx) * 1.2deg));
            transition: transform 0.15s ease-out;
        }

        .card {
            position: relative;
            overflow: hidden;
            padding: 28px;
            border-radius: 30px;
            background: var(--glass);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transform-style: preserve-3d;
            transition: transform 0.25s ease;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.16), transparent 35%),
                radial-gradient(circle at calc(50% + var(--mx) * 35px) calc(50% + var(--my) * 35px), rgba(0,200,255,0.18), transparent 45%);
            pointer-events: none;
        }

        .card h2 {
            position: relative;
            z-index: 2;
            margin-top: 0;
            color: var(--secondary);
            font-family: 'Orbitron', sans-serif;
        }

        .card p {
            position: relative;
            z-index: 2;
            color: var(--muted);
        }

        .link-item {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
            padding: 14px 16px;
            border-radius: 18px;
            text-decoration: none;
            color: var(--text);
            background: rgba(0,200,255,0.09);
            border: 1px solid rgba(255,255,255,0.1);
            border-left: 4px solid var(--primary);
            transition: all 0.25s ease;
        }

        .link-item:hover {
            transform: translateX(6px) translateZ(20px) scale(1.02);
            background: linear-gradient(90deg, rgba(0,200,255,0.25), rgba(138,92,255,0.16));
            box-shadow: 0 12px 28px rgba(0,0,0,0.2);
        }

        #binary-clock {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: var(--clock-height);
            background: var(--glass-strong);
            backdrop-filter: blur(18px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .binary-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dot-container {
            display: flex;
            gap: 5px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.14);
            transition: all 0.2s;
        }

        .dot.active {
            background: var(--secondary);
            transform: scale(1.25);
            box-shadow: 0 0 12px var(--secondary);
        }

        @media (max-width: 480px) {
            #seconds-col {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="scene">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
</div>

<header>
    <div class="logo">AAB Links</div>
</header>

<main>

<section class="card">
    <h2>👤 Perfil</h2>
    <p>Seja bem-vindo(a) à minha coletânea de links e projetos.</p>
</section>

<section class="card">
    <h2>🎨 Projetos</h2>
    <a href="#" class="link-item">Blender Projects</a>
    <a href="#" class="link-item">Gimp Projects</a>
    <a href="#" class="link-item">Animated Background</a>
</section>

<section class="card">
    <h2>🎮 Jogos</h2>
    <a href="#" class="link-item">HTML Games</a>
    <a href="#" class="link-item">MP3 Visualizer</a>
</section>

</main>

<div id="binary-clock">
    <div class="binary-column">
        <span>Hora</span>
        <div class="dot-container" id="hh">
            <div class="dot" data-weight="16"></div>
            <div class="dot" data-weight="8"></div>
            <div class="dot" data-weight="4"></div>
            <div class="dot" data-weight="2"></div>
            <div class="dot" data-weight="1"></div>
        </div>
    </div>

    <div class="binary-column">
        <span>Min</span>
        <div class="dot-container" id="mm">
            <div class="dot" data-weight="32"></div>
            <div class="dot" data-weight="16"></div>
            <div class="dot" data-weight="8"></div>
            <div class="dot" data-weight="4"></div>
            <div class="dot" data-weight="2"></div>
            <div class="dot" data-weight="1"></div>
        </div>
    </div>
</div>

<script>
    let targetX = 0;
    let targetY = 0;
    let currentX = 0;
    let currentY = 0;

    function updateMouseVars(clientX, clientY) {
        targetX = (clientX / window.innerWidth - 0.5) * 2;
        targetY = (clientY / window.innerHeight - 0.5) * 2;
    }

    window.addEventListener('mousemove', e => {
        updateMouseVars(e.clientX, e.clientY);
    });

    function animatePerspective() {
        currentX += (targetX - currentX) * 0.06;
        currentY += (targetY - currentY) * 0.06;

        document.documentElement.style.setProperty('--mx', currentX.toFixed(4));
        document.documentElement.style.setProperty('--my', currentY.toFixed(4));

        requestAnimationFrame(animatePerspective);
    }

    animatePerspective();

    document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('mousemove', e => {
            const rect = card.getBoundingClientRect();

            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;

            card.style.transform =
                `rotateX(${-y * 9}deg)
                 rotateY(${x * 11}deg)
                 translateY(-8px)
                 translateZ(30px)`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = '';
        });
    });

    function updateBinaryClock() {
        const now = new Date();

        function updateColumn(value, columnId) {
            const dots = document.getElementById(columnId).querySelectorAll('.dot');
            const weights = Array.from(dots)
                .map(d => parseInt(d.dataset.weight))
                .sort((a, b) => b - a);

            let tempValue = value;

            dots.forEach((dot, index) => {
                const weight = weights[index];

                if (tempValue >= weight) {
                    dot.classList.add('active');
                    tempValue -= weight;
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        updateColumn(now.getHours(), 'hh');
        updateColumn(now.getMinutes(), 'mm');
    }

    setInterval(updateBinaryClock, 1000);
    updateBinaryClock();
</script>

</body>
</html>
