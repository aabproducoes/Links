<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NCS Visualizer Stable</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

#visualizerCanvas{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    background:#000;
    z-index:0;
}

#controls{
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;

    background:rgba(0,0,0,.7);
    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.15);

    padding:14px;
    border-radius:14px;

    color:white;

    min-width:700px;

    box-shadow:
        0 0 25px rgba(0,255,120,.25);
}

.top-row{
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:center;
    margin-bottom:10px;
}

#visualizationSelect,
#playlistSelect{
    background:#111;
    color:white;
    border:1px solid #333;
    border-radius:6px;
    padding:5px;
    font-size:15px;
}

#fileName{
    color:#00ff88;
    font-weight:bold;
}

.music-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:10px;
}

.music-controls button{
    border:none;
    background:none;
    color:#00ff88;
    cursor:pointer;
    font-size:26px;
    transition:.2s;
}

.music-controls button:hover{
    transform:scale(1.1);
    color:#00ffff;
}

#progress{
    width:220px;
}

#volume{
    width:90px;
}

#shuffleBtn{
    opacity:.4;
}

#colorControls{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:12px;
}

.color-container{
    display:flex;
    gap:5px;
}

.color-item{
    display:flex;
    gap:3px;
    align-items:center;
}

.color-item button{
    background:none;
    border:none;
    color:white;
    cursor:pointer;
}

.add-color{
    background:#111;
    color:white;
    border:1px solid #444;
    border-radius:4px;
    cursor:pointer;
    padding:2px 8px;
}

@media(max-width:800px){

    #controls{
        width:95%;
        min-width:unset;
    }

    .music-controls{
        flex-wrap:wrap;
    }

    #progress{
        width:100%;
    }
}
</style>
</head>
<body>

<canvas id="visualizerCanvas"></canvas>

<div id="controls">

    <div class="top-row">

        <select id="visualizationSelect">
            <option value="bars">Bars</option>
            <option value="waves">Waves</option>
            <option value="circles">Circles</option>
            <option value="radial">Radial</option>
            <option value="spiral">Spiral</option>
            <option value="waveform">Waveform</option>
            <option value="dots">Dots</option>
        </select>

        <span id="fileName"></span>

    </div>

    <select id="playlistSelect"></select>

    <div class="music-controls">

        <button id="prevBtn">⏮</button>

        <button id="playBtn">▶</button>

        <button id="stopBtn">⏹</button>

        <button id="nextBtn">⏭</button>

        <input id="progress"
               type="range"
               min="0"
               max="100"
               value="0">

        <input id="volume"
               type="range"
               min="0"
               max="1"
               step="0.01"
               value="1">

        <button id="shuffleBtn">🔀</button>

    </div>

    <div id="colorControls">

        <div>

            <span>Main:</span>

            <div id="visualizerColors"
                 class="color-container"></div>

            <button id="addVisualizerColor"
                    class="add-color">
                +
            </button>

        </div>

    </div>

</div>

<audio id="audio"
       crossorigin="anonymous"></audio>

<script>
/* ---------------- RELIABLE PLAYLIST ---------------- */

let playlist=[
{
    name:"DEAF KEV – Invincible",
    url:"https://archive.org/download/deaf-kev-invincible-ncs-release_202403/DEAF%20KEV%20-%20Invincible%20%5BNCS%20Release%5D.mp3"
},
{
    name:"Alan Walker – Spectre",
    url:"https://archive.org/download/soundcloud-184757886/Alan%20Walker%20-%20Spectre%20%5BNCS%20Release%5D.mp3"
}
];

let currentTrackIndex=0;
let shuffle=false;
let startedAnimation=false;

const $=id=>document.getElementById(id);

/* ---------------- CANVAS ---------------- */

const canvas=$('visualizerCanvas');
const ctx=canvas.getContext('2d');

let WIDTH;
let HEIGHT;

function resize(){

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

    WIDTH=canvas.width;
    HEIGHT=canvas.height;
}

resize();

window.addEventListener('resize',resize);

/* ---------------- AUDIO ---------------- */

const audio=$('audio');

let audioCtx;
let source;
let analyser;
let data;

/* ---------------- COLORS ---------------- */

function makeColor(v){

    const d=document.createElement('div');
    d.className='color-item';

    const i=document.createElement('input');
    i.type='color';
    i.value=v;

    const x=document.createElement('button');
    x.textContent='×';

    x.onclick=()=>{

        if(d.parentElement.children.length>1){
            d.remove();
        }
    };

    d.append(i,x);

    return d;
}

$('visualizerColors').appendChild(
    makeColor('#00ff88')
);

$('addVisualizerColor').onclick=()=>{

    $('visualizerColors').appendChild(
        makeColor('#00ff88')
    );
};

function gradient(){

    const colors=[
        ...document.querySelectorAll(
            '#visualizerColors input'
        )
    ].map(x=>x.value);

    if(colors.length===1){
        return colors[0];
    }

    const g=ctx.createLinearGradient(
        0,0,WIDTH,HEIGHT
    );

    colors.forEach((c,i)=>{

        g.addColorStop(
            i/(colors.length-1),
            c
        );
    });

    return g;
}

/* ---------------- AUDIO INIT ---------------- */

function initAudio(){

    if(audioCtx)return;

    audioCtx=new AudioContext();

    source=
        audioCtx.createMediaElementSource(audio);

    analyser=
        audioCtx.createAnalyser();

    analyser.fftSize=512;

    data=new Uint8Array(
        analyser.frequencyBinCount
    );

    source.connect(analyser);

    analyser.connect(audioCtx.destination);
}

/* ---------------- VISUALIZERS ---------------- */

const vis={

bars:d=>{

    ctx.clearRect(0,0,WIDTH,HEIGHT);

    const bw=(WIDTH/d.length)*2.5;

    for(let i=0,x=0;i<d.length;i++,x+=bw+1){

        const h=d[i]*2;

        ctx.fillStyle=gradient();

        ctx.fillRect(
            x,
            HEIGHT-h,
            bw,
            h
        );
    }
},

waves:d=>{

    ctx.clearRect(0,0,WIDTH,HEIGHT);

    ctx.beginPath();

    ctx.moveTo(0,HEIGHT/2);

    for(let i=0;i<d.length;i++){

        ctx.lineTo(
            i*(WIDTH/d.length),
            HEIGHT/2+d[i]-128
        );
    }

    ctx.strokeStyle=gradient();
    ctx.lineWidth=3;
    ctx.stroke();
},

circles:d=>{

    ctx.clearRect(0,0,WIDTH,HEIGHT);

    for(let i=0;i<d.length;i+=8){

        ctx.beginPath();

        ctx.arc(
            WIDTH/2,
            HEIGHT/2,
            d[i],
            0,
            Math.PI*2
        );

        ctx.strokeStyle=gradient();
        ctx.stroke();
    }
},

radial:d=>{

    ctx.clearRect(0,0,WIDTH,HEIGHT);

    const cx=WIDTH/2;
    const cy=HEIGHT/2;

    for(let i=0;i<d.length;i++){

        const a=
            i/d.length*Math.PI*2;

        const len=d[i]*1.5;

        ctx.beginPath();

        ctx.moveTo(cx,cy);

        ctx.lineTo(
            cx+Math.cos(a)*len,
            cy+Math.sin(a)*len
        );

        ctx.strokeStyle=gradient();
        ctx.stroke();
    }
},

spiral:d=>{

    ctx.clearRect(0,0,WIDTH,HEIGHT);

    ctx.beginPath();

    let a=0;
    let r=0;

    ctx.moveTo(WIDTH/2,HEIGHT/2);

    for(const v of d){

        a+=0.2;
        r+=v/255*3;

        ctx.lineTo(
            WIDTH/2+r*Math.cos(a),
            HEIGHT/2+r*Math.sin(a)
        );
    }

    ctx.strokeStyle=gradient();
    ctx.lineWidth=3;
    ctx.stroke();
},

waveform:d=>{

    ctx.clearRect(0,0,WIDTH,HEIGHT);

    ctx.beginPath();

    const sw=WIDTH/d.length;

    for(let i=0;i<d.length;i++){

        const y=
            HEIGHT/2+(d[i]-128)*2;

        if(i===0){
            ctx.moveTo(0,y);
        }else{
            ctx.lineTo(i*sw,y);
        }
    }

    ctx.strokeStyle=gradient();
    ctx.lineWidth=3;
    ctx.stroke();
},

dots:d=>{

    ctx.fillStyle='rgba(0,0,0,.2)';
    ctx.fillRect(0,0,WIDTH,HEIGHT);

    for(let i=0;i<d.length;i+=8){

        ctx.beginPath();

        ctx.arc(
            Math.random()*WIDTH,
            Math.random()*HEIGHT,
            d[i]/10,
            0,
            Math.PI*2
        );

        ctx.fillStyle=gradient();
        ctx.fill();
    }
}

};

let currentViz='bars';

$('visualizationSelect').onchange=e=>{
    currentViz=e.target.value;
};

/* ---------------- LOOP ---------------- */

function animate(){

    if(analyser){

        analyser.getByteFrequencyData(data);

        if(vis[currentViz]){
            vis[currentViz](data);
        }
    }

    requestAnimationFrame(animate);
}

function startAnimation(){

    if(startedAnimation)return;

    startedAnimation=true;

    animate();
}

/* ---------------- PLAYER ---------------- */

const playlistSelect=$('playlistSelect');

let autoplayAfterLoad=false;

function refreshPlaylist(){

    playlistSelect.innerHTML='';

    playlist.forEach((track,i)=>{

        const o=document.createElement('option');

        o.value=i;
        o.textContent=track.name;

        playlistSelect.appendChild(o);
    });

    playlistSelect.value=currentTrackIndex;
}

function updatePlayButton(){

    $('playBtn').textContent =
        audio.paused ? '▶' : '⏸';
}

function loadTrack(i,autoplay=false){

    currentTrackIndex =
        (i + playlist.length) % playlist.length;

    autoplayAfterLoad = autoplay;

    const track = playlist[currentTrackIndex];

    $('fileName').textContent =
        'Loading: ' + track.name;

    playlistSelect.value =
        currentTrackIndex;

    audio.pause();

    audio.src = track.url;

    audio.load();

    $('progress').value = 0;

    updatePlayButton();
}

async function safePlay(){

    try{

        initAudio();

        if(audioCtx.state === 'suspended'){
            await audioCtx.resume();
        }

        await audio.play();

        $('fileName').textContent =
            playlist[currentTrackIndex].name;

        startAnimation();

        updatePlayButton();

    }catch(err){

        console.error(err);

        $('fileName').textContent =
            'Song failed.';
    }
}

function nextTrack(){

    if(shuffle){

        let n;

        do{

            n=Math.floor(
                Math.random()*playlist.length
            );

        }while(
            n===currentTrackIndex &&
            playlist.length>1
        );

        loadTrack(n,true);

    }else{

        loadTrack(
            currentTrackIndex+1,
            true
        );
    }
}

function prevTrack(){

    loadTrack(
        currentTrackIndex-1,
        true
    );
}

audio.oncanplay=()=>{

    if(autoplayAfterLoad){

        autoplayAfterLoad=false;

        safePlay();

    }else{

        $('fileName').textContent =
            playlist[currentTrackIndex].name;
    }
};

audio.onerror=()=>{

    autoplayAfterLoad=false;

    $('fileName').textContent =
        'This song URL failed.';
};

playlistSelect.onchange=()=>{

    loadTrack(
        Number(playlistSelect.value),
        true
    );
};

$('playBtn').onclick=()=>{

    if(audio.paused){

        safePlay();

    }else{

        audio.pause();

        updatePlayButton();
    }
};

$('stopBtn').onclick=()=>{

    autoplayAfterLoad=false;

    audio.pause();

    audio.currentTime=0;

    updatePlayButton();
};

$('nextBtn').onclick=nextTrack;

$('prevBtn').onclick=prevTrack;

$('shuffleBtn').onclick=()=>{

    shuffle=!shuffle;

    $('shuffleBtn').style.opacity =
        shuffle ? 1 : .4;
};

$('volume').oninput=e=>{

    audio.volume=
        Number(e.target.value);
};

audio.onended=()=>{

    nextTrack();
};

audio.addEventListener('timeupdate',()=>{

    if(audio.duration){

        $('progress').value =
            (audio.currentTime/audio.duration)
            *100;
    }
});

$('progress').addEventListener('input',()=>{

    if(audio.duration){

        audio.currentTime =
            ($('progress').value/100)
            *audio.duration;
    }
});

/* ---------------- START ---------------- */

refreshPlaylist();

loadTrack(0);

updatePlayButton();
</script>

</body>
</html>
