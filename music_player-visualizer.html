<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fixed Music Visualizer</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

#visualizerCanvas{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:0;
    background:#000;
}

#controls{
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;

    background:rgba(0,0,0,.65);
    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.15);

    padding:14px;
    border-radius:14px;

    color:white;

    min-width:700px;

    box-shadow:
        0 0 25px rgba(0,255,120,.25);
}

.top-row{
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:center;
    margin-bottom:10px;
}

#visualizationSelect,
#playlistSelect{
    background:#111;
    color:white;
    border:1px solid #333;
    border-radius:6px;
    padding:5px;
    font-size:15px;
}

#fileName{
    color:#00ff88;
    font-weight:bold;
}

.music-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:10px;
}

.music-controls button{
    border:none;
    background:none;
    color:#00ff88;
    cursor:pointer;
    font-size:26px;
    transition:.2s;
}

.music-controls button:hover{
    transform:scale(1.1);
    color:#00ffff;
}

#progress{
    width:220px;
}

#volume{
    width:90px;
}

#shuffleBtn{
    opacity:.4;
}

#colorControls{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:12px;
}

.color-container{
    display:flex;
    gap:5px;
}

.color-item{
    display:flex;
    gap:3px;
    align-items:center;
}

.color-item button{
    background:none;
    border:none;
    color:white;
    cursor:pointer;
}

.add-color{
    background:#111;
    color:white;
    border:1px solid #444;
    border-radius:4px;
    cursor:pointer;
    padding:2px 8px;
}

#equalizerControls{
    margin-top:12px;
}

.eq-sliders{
    display:flex;
    justify-content:center;
    gap:10px;
}

.eq-slider{
    display:flex;
    flex-direction:column;
    align-items:center;
    font-size:11px;
}

.eq-slider input{
    -webkit-appearance:slider-vertical;
    width:8px;
    height:100px;
}

.drop-highlight-green{
    outline:5px solid lime;
}

@media(max-width:800px){

    #controls{
        width:95%;
        min-width:unset;
    }

    .music-controls{
        flex-wrap:wrap;
    }

    #progress{
        width:100%;
    }
}
</style>
</head>
<body>

<canvas id="visualizerCanvas"></canvas>

<div id="controls">

    <div class="top-row">

        <select id="visualizationSelect">
            <option value="bars">Bars</option>
            <option value="waves">Waves</option>
            <option value="circles">Circles</option>
            <option value="radial">Radial</option>
            <option value="spiral">Spiral</option>
            <option value="equalizer">Equalizer</option>
            <option value="waveform">Waveform</option>
            <option value="dots">Dots</option>
            <option value="triangles">Triangles</option>
            <option value="rectangles">Rectangles</option>
            <option value="stars">Stars</option>
            <option value="rings">Rings</option>
            <option value="treeFractal">Tree Fractal</option>
        </select>

        <span id="fileName"></span>

    </div>

    <select id="playlistSelect"></select>

    <div class="music-controls">

        <button id="prevBtn">⏮</button>

        <button id="playBtn">▶</button>

        <button id="stopBtn">⏹</button>

        <button id="nextBtn">⏭</button>

        <input id="progress" type="range" min="0" max="100" value="0">

        <input id="volume" type="range" min="0" max="1" step="0.01" value="1">

        <button id="shuffleBtn">🔀</button>

    </div>

    <div id="colorControls">

        <div>
            <span>Main:</span>

            <div id="visualizerColors" class="color-container"></div>

            <button id="addVisualizerColor" class="add-color">
                +
            </button>
        </div>

    </div>

    <div id="equalizerControls">

        <h3 style="text-align:center;">
            Equalizer
        </h3>

        <div id="eqSliders" class="eq-sliders"></div>

    </div>

</div>

<audio id="audio" crossorigin="anonymous"></audio>

<script>
/* ---------------- PLAYLIST ---------------- */

let playlist=[
{
    name:"DEAF KEV – Invincible",
    url:"https://archive.org/download/deaf-kev-invincible-ncs-release_202403/DEAF%20KEV%20-%20Invincible%20%5BNCS%20Release%5D.mp3"
},
{
    name:"Cartoon – On & On",
    url:"https://archive.org/download/CartoonOnOnft.DanielLevi/Cartoon%20-%20On%20%26%20On%20%28ft.%20Daniel%20Levi%29.mp3"
},
{
    name:"Alan Walker – Spectre",
    url:"https://archive.org/download/alan-walker-spectre-ncs-release/Alan%20Walker%20-%20Spectre%20%5BNCS%20Release%5D.mp3"
},
{
    name:"Tobu – Hope",
    url:"https://archive.org/download/TobuHope/Tobu%20-%20Hope.mp3"
},
{
    name:"Jim Yosef – Firefly",
    url:"https://archive.org/download/JimYosefFirefly/Jim%20Yosef%20-%20Firefly.mp3"
}
];

let currentTrackIndex=0;
let shuffle=false;
let startedAnimation=false;
let shouldAutoPlay=false;

const $=id=>document.getElementById(id);

/* ---------------- CANVAS ---------------- */

const canvas=$('visualizerCanvas');
const ctx=canvas.getContext('2d');

let WIDTH;
let HEIGHT;

function resize(){

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

    WIDTH=canvas.width;
    HEIGHT=canvas.height;
}

resize();

window.addEventListener('resize',resize);

/* ---------------- AUDIO ---------------- */

const audio=$('audio');

let audioCtx;
let source;
let analyser;
let data;
let filters=[];

/* ---------------- COLORS ---------------- */

function makeColor(v){

    const d=document.createElement('div');
    d.className='color-item';

    const i=document.createElement('input');
    i.type='color';
    i.value=v;

    const x=document.createElement('button');
    x.textContent='×';

    x.onclick=()=>{

        if(d.parentElement.children.length>1){
            d.remove();
        }
    };

    d.append(i,x);

    return d;
}

$('visualizerColors').appendChild(
    makeColor('#00ff88')
);

$('addVisualizerColor').onclick=()=>{

    $('visualizerColors').appendChild(
        makeColor('#00ff88')
    );
};

function gradient(){

    const colors=[
        ...document.querySelectorAll(
            '#visualizerColors input'
        )
    ].map(x=>x.value);

    if(colors.length===1){
        return colors[0];
    }

    const g=ctx.createLinearGradient(
        0,0,WIDTH,HEIGHT
    );

    colors.forEach((c,i)=>{

        g.addColorStop(
            i/(colors.length-1),
            c
        );
    });

    return g;
}

/* ---------------- AUDIO INIT ---------------- */

function initAudio(){

    if(audioCtx)return;

    audioCtx=new AudioContext();

    source=
        audioCtx.createMediaElementSource(audio);

    filters=[
        60,170,310,600,
        1000,3000,6000,12000
    ].map(freq=>{

        const b=
            audioCtx.createBiquadFilter();

        b.type='peaking';
        b.frequency.value=freq;
        b.gain.value=0;

        return b;
    });

    analyser=
        audioCtx.createAnalyser();

    analyser.fftSize=512;

    data=new Uint8Array(
        analyser.frequencyBinCount
    );

    let node=source;

    filters.forEach(f=>{

        node.connect(f);

        node=f;
    });

    node.connect(analyser);

    analyser.connect(audioCtx.destination);

    buildEQ();
}

/* ---------------- EQ ---------------- */

function buildEQ(){

    const box=$('eqSliders');

    if(box.children.length)return;

    const labels=[
        '60','170','310','600',
        '1k','3k','6k','12k'
    ];

    labels.forEach((lbl,i)=>{

        const wrap=document.createElement('div');
        wrap.className='eq-slider';

        const slider=document.createElement('input');

        slider.type='range';
        slider.min=-12;
        slider.max=12;
        slider.step=.1;
        slider.value=0;

        slider.oninput=()=>{

            filters[i].gain.value=
                Number(slider.value);
        };

        const text=document.createElement('span');
        text.textContent=lbl;

        wrap.append(slider,text);

        box.appendChild(wrap);
    });
}

/* ---------------- VISUALIZERS ---------------- */

const vis={

bars:d=>{

    ctx.clearRect(0,0,WIDTH,HEIGHT);

    const bw=(WIDTH/d.length)*2.5;

    for(let i=0,x=0;i<d.length;i++,x+=bw+1){

        const h=d[i]*2;

        ctx.fillStyle=gradient();

        ctx.fillRect(
            x,
            HEIGHT-h,
            bw,
            h
        );
    }
},

waves:d=>{

    ctx.clearRect(0,0,WIDTH,HEIGHT);

    ctx.beginPath();

    ctx.moveTo(0,HEIGHT/2);

    for(let i=0;i<d.length;i++){

        ctx.lineTo(
            i*(WIDTH/d.length),
            HEIGHT/2+d[i]-128
        );
    }

    ctx.strokeStyle=gradient();
    ctx.lineWidth=3;
    ctx.stroke();
},

circles:d=>{

    ctx.clearRect(0,0,WIDTH,HEIGHT);

    for(let i=0;i<d.length;i+=8){

        ctx.beginPath();

        ctx.arc(
            WIDTH/2,
            HEIGHT/2,
            d[i],
            0,
            Math.PI*2
        );

        ctx.strokeStyle=gradient();

        ctx.stroke();
    }
},

radial:d=>{

    ctx.clearRect(0,0,WIDTH,HEIGHT);

    const cx=WIDTH/2;
    const cy=HEIGHT/2;

    for(let i=0;i<d.length;i++){

        const a=
            i/d.length*Math.PI*2;

        const len=d[i]*1.5;

        ctx.beginPath();

        ctx.moveTo(cx,cy);

        ctx.lineTo(
            cx+Math.cos(a)*len,
            cy+Math.sin(a)*len
        );

        ctx.strokeStyle=gradient();

        ctx.stroke();
    }
},

spiral:d=>{

    ctx.clearRect(0,0,WIDTH,HEIGHT);

    ctx.beginPath();

    let a=0;
    let r=0;

    ctx.moveTo(WIDTH/2,HEIGHT/2);

    for(const v of d){

        a+=0.2;

        r+=v/255*3;

        ctx.lineTo(
            WIDTH/2+r*Math.cos(a),
            HEIGHT/2+r*Math.sin(a)
        );
    }

    ctx.strokeStyle=gradient();
    ctx.lineWidth=3;
    ctx.stroke();
},

equalizer:d=>vis.bars(d),

waveform:d=>{

    ctx.clearRect(0,0,WIDTH,HEIGHT);

    ctx.beginPath();

    const sw=WIDTH/d.length;

    for(let i=0;i<d.length;i++){

        const y=
            HEIGHT/2+(d[i]-128)*2;

        if(i===0){
            ctx.moveTo(0,y);
        }else{
            ctx.lineTo(i*sw,y);
        }
    }

    ctx.strokeStyle=gradient();
    ctx.lineWidth=3;
    ctx.stroke();
},

dots:d=>{

    ctx.fillStyle='rgba(0,0,0,.2)';
    ctx.fillRect(0,0,WIDTH,HEIGHT);

    for(let i=0;i<d.length;i+=8){

        ctx.beginPath();

        ctx.arc(
            Math.random()*WIDTH,
            Math.random()*HEIGHT,
            d[i]/10,
            0,
            Math.PI*2
        );

        ctx.fillStyle=gradient();
        ctx.fill();
    }
},

triangles:d=>{

    ctx.clearRect(0,0,WIDTH,HEIGHT);

    for(let i=0;i<12;i++){

        const x=Math.random()*WIDTH;
        const y=Math.random()*HEIGHT;
        const s=d[i]*1.5;

        ctx.beginPath();

        ctx.moveTo(x,y-s);
        ctx.lineTo(x-s,y+s);
        ctx.lineTo(x+s,y+s);

        ctx.closePath();

        ctx.fillStyle=gradient();
        ctx.fill();
    }
},

rectangles:d=>{

    ctx.clearRect(0,0,WIDTH,HEIGHT);

    const cols=12;
    const rows=8;

    const w=WIDTH/cols;
    const h=HEIGHT/rows;

    for(let i=0;i<cols;i++){

        for(let j=0;j<rows;j++){

            const idx=(i*rows+j)%d.length;

            const s=d[idx]/255;

            ctx.fillStyle=gradient();

            ctx.fillRect(
                i*w+w*(1-s)/2,
                j*h+h*(1-s)/2,
                w*s,
                h*s
            );
        }
    }
},

stars:d=>{

    ctx.clearRect(0,0,WIDTH,HEIGHT);

    const outer=d[5]+100;
    const inner=outer*0.45;

    const cx=WIDTH/2;
    const cy=HEIGHT/2;

    ctx.beginPath();

    for(let i=0;i<10;i++){

        const r=i%2?inner:outer;

        const a=
            i*Math.PI/5-Math.PI/2;

        ctx.lineTo(
            cx+Math.cos(a)*r,
            cy+Math.sin(a)*r
        );
    }

    ctx.closePath();

    ctx.fillStyle=gradient();
    ctx.fill();
},

rings:d=>{

    ctx.clearRect(0,0,WIDTH,HEIGHT);

    for(let i=1;i<=10;i++){

        ctx.beginPath();

        ctx.arc(
            WIDTH/2,
            HEIGHT/2,
            i*30+d[i],
            0,
            Math.PI*2
        );

        ctx.strokeStyle=gradient();

        ctx.stroke();
    }
},

treeFractal:d=>{

    ctx.clearRect(0,0,WIDTH,HEIGHT);

    const amp=
        d.reduce((a,b)=>a+b,0)
        /(d.length*255);

    ctx.save();

    ctx.translate(WIDTH/2,HEIGHT);

    function draw(l,a,dep){

        if(dep<=0)return;

        ctx.beginPath();

        ctx.moveTo(0,0);

        ctx.lineTo(0,-l);

        ctx.strokeStyle=gradient();
        ctx.lineWidth=dep/2;

        ctx.stroke();

        ctx.translate(0,-l);

        ctx.save();
        ctx.rotate(a+amp);
        draw(l*0.7,a,dep-1);
        ctx.restore();

        ctx.save();
        ctx.rotate(-a+amp);
        draw(l*0.7,a,dep-1);
        ctx.restore();
    }

    draw(
        120+amp*100,
        Math.PI/5,
        9
    );

    ctx.restore();
}

};

let currentViz='bars';

$('visualizationSelect').onchange=e=>{
    currentViz=e.target.value;
};

/* ---------------- LOOP ---------------- */

function animate(){

    if(analyser){

        analyser.getByteFrequencyData(data);

        vis[currentViz](data);
    }

    requestAnimationFrame(animate);
}

function startAnimation(){

    if(startedAnimation)return;

    startedAnimation=true;

    animate();
}

/* ---------------- PLAYLIST ---------------- */

const playlistSelect=$('playlistSelect');

function refreshPlaylist(){

    playlistSelect.innerHTML='';

    playlist.forEach((track,i)=>{

        const o=document.createElement('option');

        o.value=i;
        o.textContent=track.name;

        playlistSelect.appendChild(o);
    });

    playlistSelect.value=currentTrackIndex;
}

function updatePlayButton(){

    $('playBtn').textContent=
        audio.paused ? '▶' : '⏸';
}

function loadTrack(i,autoplay=false){

    currentTrackIndex=
        (i+playlist.length)%playlist.length;

    const track=
        playlist[currentTrackIndex];

    shouldAutoPlay=autoplay;

    $('fileName').textContent=
        'Loading: '+track.name;

    playlistSelect.value=currentTrackIndex;

    audio.pause();

    audio.removeAttribute('src');

    audio.load();

    audio.src=track.url;

    audio.load();

    $('progress').value=0;

    updatePlayButton();
}

async function playCurrent(){

    try{

        initAudio();

        if(audioCtx.state==='suspended'){

            await audioCtx.resume();
        }

        await audio.play();

        $('fileName').textContent=
            playlist[currentTrackIndex].name;

        startAnimation();

        updatePlayButton();

    }catch(err){

        console.error(err);

        $('fileName').textContent=
            'Click play again';
    }
}

function nextTrack(){

    if(shuffle){

        let n;

        do{

            n=Math.floor(
                Math.random()*playlist.length
            );

        }while(
            n===currentTrackIndex &&
            playlist.length>1
        );

        loadTrack(n,true);

    }else{

        loadTrack(
            currentTrackIndex+1,
            true
        );
    }
}

function prevTrack(){

    loadTrack(
        currentTrackIndex-1,
        true
    );
}

/* ---------------- EVENTS ---------------- */

playlistSelect.onchange=()=>{

    loadTrack(
        Number(playlistSelect.value),
        true
    );
};

$('playBtn').onclick=()=>{

    if(audio.paused){

        playCurrent();

    }else{

        audio.pause();

        updatePlayButton();
    }
};

$('stopBtn').onclick=()=>{

    audio.pause();

    audio.currentTime=0;

    updatePlayButton();
};

$('nextBtn').onclick=nextTrack;

$('prevBtn').onclick=prevTrack;

$('shuffleBtn').onclick=()=>{

    shuffle=!shuffle;

    $('shuffleBtn').style.opacity=
        shuffle?1:.4;
};

$('volume').oninput=e=>{

    audio.volume=
        Number(e.target.value);
};

audio.addEventListener(
    'canplay',
    ()=>{

        if(shouldAutoPlay){

            shouldAutoPlay=false;

            playCurrent();
        }
    }
);

audio.addEventListener(
    'ended',
    ()=>{

        nextTrack();
    }
);

audio.addEventListener(
    'timeupdate',
    ()=>{

        if(audio.duration){

            $('progress').value=
                (audio.currentTime/audio.duration)
                *100;
        }
    }
);

$('progress').addEventListener(
    'input',
    ()=>{

        if(audio.duration){

            audio.currentTime=
                ($('progress').value/100)
                *audio.duration;
        }
    }
);

/* ---------------- DRAG DROP ---------------- */

document.addEventListener(
    'dragover',
    e=>{

        e.preventDefault();

        document.body.classList.add(
            'drop-highlight-green'
        );
    }
);

document.addEventListener(
    'dragleave',
    ()=>{

        document.body.classList.remove(
            'drop-highlight-green'
        );
    }
);

document.addEventListener(
    'drop',
    async e=>{

        e.preventDefault();

        document.body.classList.remove(
            'drop-highlight-green'
        );

        const files=[
            ...e.dataTransfer.files
        ];

        for(const file of files){

            if(file.type.startsWith('audio/')){

                const url=
                    URL.createObjectURL(file);

                playlist.push({
                    name:file.name,
                    url
                });
            }

            if(file.name.endsWith('.txt')){

                const text=
                    await file.text();

                text.split(/\r?\n/)
                .forEach(line=>{

                    const url=line.trim();

                    if(url){

                        playlist.push({
                            name:
                                url.split('/').pop(),
                            url
                        });
                    }
                });
            }
        }

        refreshPlaylist();
    }
);

/* ---------------- START ---------------- */

refreshPlaylist();

loadTrack(0);

updatePlayButton();
</script>

</body>
</html>
